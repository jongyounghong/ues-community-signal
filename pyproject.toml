[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ues-community-signal"
version = "0.1.0"
description = "Fail-closed policy and privacy boundary for a proposed Reddit community-signal adapter"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
